<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional insurance services for auto, home, life, and health insurance. Get comprehensive coverage with competitive rates.">
  
  <!-- Open Graph for social media -->
  <meta property="og:title" content="My Insure Page - Professional Insurance Services">
  <meta property="og:description" content="Comprehensive insurance solutions for all your needs">
  <meta property="og:type" content="website">
  
  <title>My Insure Page - Professional Insurance Services</title>
  
  <!-- Preload critical resources -->
  <link rel="preload" href="/src/styles/main.css" as="style">
  
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <!-- Skip navigation for accessibility -->
  <a href="#main" class="skip-link">Skip to main content</a>
  
  <!-- Semantic header with navigation -->
  <header role="banner" data-sticky="true">
    <nav role="navigation" aria-label="Main navigation">
      <div class="nav-container">
        <!-- Logo -->
        <a href="/" class="logo" aria-label="My Insure Page - Home">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="40" height="40" rx="8" fill="#007bff"/>
            <path d="M20 10L12 16V26C12 27.1 12.9 28 14 28H26C27.1 28 28 27.1 28 26V16L20 10Z" fill="white"/>
            <path d="M20 24C21.66 24 23 22.66 23 21C23 19.34 21.66 18 20 18C18.34 18 17 19.34 17 21C17 22.66 18.34 24 20 24Z" fill="#007bff"/>
          </svg>
          <span class="logo-text">My Insure Page</span>
        </a>
        
        <!-- Mobile menu button -->
        <button 
          type="button" 
          class="mobile-menu-button" 
          data-menu-toggle
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="main-navigation"
        >
          <svg class="hamburger-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 6H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        
        <!-- Navigation links -->
        <ul id="main-navigation" class="nav-links" role="list">
          <li>
            <a href="#home" aria-current="page">Home</a>
          </li>
          <li>
            <a href="#services">Services</a>
          </li>
          <li>
            <a href="#about">About</a>
          </li>
          <li>
            <a href="#contact">Contact</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  
  <!-- Main content with landmark -->
  <main id="main" role="main">
    <!-- Content will be added in subsequent tasks -->
  </main>
  
  <script type="module" src="/src/scripts/main.js"></script>

</html>
